services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sigr}
      POSTGRES_USER: ${DB_USER:-sigr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sigr}
    volumes:
      - sigr-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sigr} -d ${DB_NAME:-sigr}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sigr}
      DB_USER: ${DB_USER:-sigr}
      DB_PASSWORD: ${DB_PASSWORD:-sigr}
      JWT_SECRET: ${JWT_SECRET}
      SIGR_ADMIN_EMAIL: ${SIGR_ADMIN_EMAIL:-admin@sigr.local}
      SIGR_ADMIN_PASSWORD: ${SIGR_ADMIN_PASSWORD}
      CORS_ORIGENES: http://localhost:5173
      TZ: America/Bogota
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  sigr-data:
