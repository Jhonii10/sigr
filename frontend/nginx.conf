server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker. Al usar una variable en proxy_pass, nginx resuelve "backend" en cada
  # petición (con caché de 5 s) en lugar de una sola vez al arrancar. Así el despliegue
  # blue-green puede mover el alias "backend" de un contenedor a otro sin reiniciar nginx,
  # y nginx arranca aunque el backend todavía no exista.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend http://backend:8080;

  location /api/ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
