# Etapa de empaquetado: construye las imágenes Docker, las escanea con Trivy y las publica en GHCR.
# Imágenes: ghcr.io/<owner>/sigr-backend:<sha> y ghcr.io/<owner>/sigr-frontend:<sha>
name: Empaquetado

on:
  workflow_call:
    inputs:
      image-tag:
        description: Etiqueta de las imágenes (SHA del commit)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    name: Imagen ${{ matrix.componente }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        componente: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nombre de la imagen (GHCR exige el owner en minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sigr-${{ matrix.componente }}:${{ inputs.image-tag }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen (se carga localmente para escanearla antes de publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.componente }}
          load: true
          push: false
          tags: ${{ env.IMAGEN }}
          # La etiqueta "source" enlaza el paquete de GHCR con el repositorio (permite el pull con GITHUB_TOKEN).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}

      - name: Escanear imagen con Trivy (bloquea con CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGEN }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Login a GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        run: |
          docker push "$IMAGEN"
          echo "Imagen publicada: \`$IMAGEN\`" >> "$GITHUB_STEP_SUMMARY"
